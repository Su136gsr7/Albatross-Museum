name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build web assets & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Accept Android SDK licenses & Build Debug APK
        working-directory: android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Our Little Universe APK
        uses: actions/upload-artifact@v4
        with:
          name: OurLittleUniverse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
